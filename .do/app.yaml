name: androguard
region: blr
services:
  - name: api
    github:
      repo: YOUR_GITHUB_ORG/AndroGuard
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/v1/health
    envs:
      - key: LOG_LEVEL
        value: INFO
      - key: TEMP_ROOT
        value: /app/tmp
      - key: MAX_APK_SIZE_MB
        value: "80"
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "90"
      - key: UVICORN_WORKERS
        value: "1"
      - key: DATABASE_URL
        type: SECRET
        value: REPLACE_ME
